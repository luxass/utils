ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  dev:
    "@types/node": 25.9.9
    oxfmt: 0.73.0
    oxlint: 1.69.0
    oxlint-tsgolint: 0.25.0
    publint: 0.3.25
    tsdown: 0.23.1
    typescript: 6.0.3
    vitest: 4.1.8
    vitest-testdirs: 4.5.2
    tsnapi: 0.3.4

  prod:
    p-retry: 8.0.1
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
