ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  dev:
    "@types/node": 25.9.2
    oxfmt: 0.54.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.21
    tsdown: 0.23.5
    typescript: 6.0.3
    vitest: 5.1.0
    vitest-testdirs: 4.4.3
    tsnapi: 0.3.3

  prod:
    p-retry: 8.0.0
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
