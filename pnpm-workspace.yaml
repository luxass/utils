ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  dev:
    "@types/node": 26.6.6
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.21
    tsdown: 0.23.5
    typescript: 7.0.2
    vitest: 5.1.0
    vitest-testdirs: 4.5.2
    tsnapi: 1.6.1

  prod:
    p-retry: 9.0.0
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
